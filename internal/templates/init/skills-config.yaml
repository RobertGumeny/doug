# Skills Configuration
# Maps task types to local skill names.
#
# Skills should stay task-generic. Repository-specific operating rules belong
# in AGENTS.md.
#
# Default mappings (change only if you want different workflows):
skill_mappings:
  # Feature implementation workflow
  feature: implement-feature

  # Bug fix workflow
  bugfix: implement-bugfix

  # Documentation workflow
  documentation: implement-documentation

  # Manual review checkpoint
  manual_review: manual-review

  # Manifest-driven project scaffold workflow
  scaffold: scaffold

# Add your custom task types below:
# Examples:
#
#   # Custom refactoring workflow
#   refactor: implement-refactor
#
#   # Security audit workflow
#   security-audit: security-scan-and-report
#
#   # Performance optimization workflow
#   performance: performance-optimization
#
# After adding a custom type:
# 1. Create the skill file under your active provider directory, for example:
#    .claude/skills/{skill-name}/SKILL.md
#    .codex/skills/{skill-name}/SKILL.md
#    .gemini/skills/{skill-name}/SKILL.md
# 2. Use the new task type in your own workflow or task source
# 3. Make sure AGENTS.md covers any repository-specific operating rules
