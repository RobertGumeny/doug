# Skills Configuration
# Maps task types to skill names. When doug runs a task, it looks up the task's
# type here and passes the resolved skill name to the agent via the agent command.
# Skills contain the workflow instructions (how to do the work); repository-specific
# operating rules belong in AGENTS.md, not in skill files.
#
# Default mappings (change only if you want different workflows):
skill_mappings:
  # Feature implementation workflow
  feature: implement-feature

  # Bug fix workflow
  bugfix: implement-bugfix

  # Documentation workflow
  documentation: implement-documentation

  # Manual review checkpoint
  manual_review: manual-review

  # Manifest-driven project scaffold workflow
  scaffold: scaffold

  # Interactive planning workflow
  plan: plan

# Add your custom task types below:
# Examples:
#
#   # Custom refactoring workflow
#   refactor: implement-refactor
#
#   # Security audit workflow
#   security-audit: security-scan-and-report
#
#   # Performance optimization workflow
#   performance: performance-optimization
#
# After adding a custom type:
# 1. Create the skill file under your active agent's skills directory:
#    .claude/skills/{skill-name}/SKILL.md   (if using Claude)
#    .codex/skills/{skill-name}/SKILL.md    (if using Codex)
#    .gemini/skills/{skill-name}/SKILL.md   (if using Gemini)
#    Use `doug switch {agent}` to change the active agent at any time.
# 2. Use the new task type in your tasks.yaml
# 3. Add any repository-specific operating rules for the new type to AGENTS.md
